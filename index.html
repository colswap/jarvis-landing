    <!-- GA4 는 `src/analytics.ts` 에 있다. 여기 `<head>` 에 스니펫을 두지 않은 이유:
         측정 ID 를 VITE_GA_ID 에서 읽는데, html 안의 `%VITE_GA_ID%` 는 변수가 없을 때
         그 문자열이 그대로 남아 깨진 주소를 때린다. 모듈에서는 없으면 없는 것이 기본값이다.
         ID 는 Vercel 의 Production 환경변수로만 들어간다 — 레포에도 이 파일에도 없다. -->

    <!-- CSS 가 붙기 전 한 프레임을 이 색이 메운다. --base 와 같은 값이라야 안 번쩍인다. -->
    <style>
      html { background: #05070a; color-scheme: dark; }
      #root { min-height: 100dvh; }
    </style>

  <body>
    <div id="root"></div>
